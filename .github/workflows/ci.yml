name: Continuous Integration (CI)

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches-ignore: ["main", "master", "gh-pages"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html missing!" && exit 1)
          test -f dist/404.html || (echo "dist/404.html missing!" && exit 1)
          test -f dist/.nojekyll || (echo "dist/.nojekyll missing!" && exit 1)
          echo "All production artifacts verified successfully!"
